[workspace]
resolver = "2"
members = [
    "crates/mrt-gtfs",
    "crates/mrt-gtfs-rt",
    "crates/mrt-datamall",
    "crates/mrt-live",
    "crates/mrt-board-web",
    "crates/mrt-board-static",
    "crates/mrt-map-web",
    "crates/mrt-map-static",
    "crates/mrt-publication",
    "crates/mrt-publication-html",
    "crates/mrt-schedule-cli",
    "crates/mrt-schedule-site",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
repository = "https://github.com/umiyuikaiteitan/Singapore-MRTracker"
authors = ["Singapore-MRTracker contributors"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The "native-certs" feature makes ureq trust the certificate store
# of the operating system. This honors SSL_CERT_FILE, which corporate
# proxies with their own certificate authority need.
ureq = { version = "2", features = ["native-certs"] }
tempfile = "3"
sha2 = "0.10"

# Internal crates.
mrt-gtfs = { path = "crates/mrt-gtfs" }
mrt-gtfs-rt = { path = "crates/mrt-gtfs-rt" }
mrt-datamall = { path = "crates/mrt-datamall" }
mrt-publication = { path = "crates/mrt-publication" }
mrt-publication-html = { path = "crates/mrt-publication-html" }
mrt-schedule-cli = { path = "crates/mrt-schedule-cli" }
