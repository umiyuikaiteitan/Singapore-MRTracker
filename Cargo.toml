[workspace]
resolver = "2"
members = [
    "crates/mrt-gtfs",
    "crates/mrt-gtfs-rt",
    "crates/mrt-datamall",
    "crates/mrt-live",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
repository = "https://github.com/umiyuikaiteitan/Singapore-MRTracker"
authors = ["Singapore-MRTracker contributors"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"
tempfile = "3"

# Internal crates.
mrt-gtfs = { path = "crates/mrt-gtfs" }
mrt-gtfs-rt = { path = "crates/mrt-gtfs-rt" }
mrt-datamall = { path = "crates/mrt-datamall" }
