name: Deploy board to GitHub Pages

on:
  # Refresh the schedule data once per hour. The SRCF forwarder and
  # the rt-refresh fallback carry the live layer between deploys.
  schedule:
    - cron: "7 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "board"

      - name: Generate the static site
        run: cargo run --release -p mrt-board-static -- site
        env:
          LTA_DATAMALL_ACCOUNT_KEY: ${{ secrets.LTA_DATAMALL_ACCOUNT_KEY }}
          MRT_DELAYS_URL: https://hw737.user.srcf.net/rail/api/live
          MRT_DELAYS_FALLBACK_URL: https://raw.githubusercontent.com/${{ github.repository }}/live-data/live.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
