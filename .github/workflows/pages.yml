name: Deploy board to GitHub Pages

on:
  # Refresh the schedule data once per hour. The SRCF forwarder and
  # the rt-refresh fallback carry the live layer between deploys.
  schedule:
    - cron: "7 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "board"

      # One download serves both generators: the board writes the site
      # root, and the timetable section is built from the same archive
      # so the two never disagree about the schedule.
      - name: Download the GTFS Schedule feed
        run: cargo run --release -p mrt-schedule-cli -- fetch --source datamall --out feed.zip
        env:
          LTA_DATAMALL_ACCOUNT_KEY: ${{ secrets.LTA_DATAMALL_ACCOUNT_KEY }}

      - name: Generate the live board
        run: cargo run --release -p mrt-board-static -- site feed.zip
        env:
          LTA_DATAMALL_ACCOUNT_KEY: ${{ secrets.LTA_DATAMALL_ACCOUNT_KEY }}
          MRT_DELAYS_URL: https://hw737.user.srcf.net/rail/api/live
          MRT_DELAYS_FALLBACK_URL: https://raw.githubusercontent.com/${{ github.repository }}/live-data/live.json

      - name: Generate the timetables and diagrams
        run: cargo run --release -p mrt-schedule-site -- site/timetables feed.zip
        env:
          MRT_SITE_DAYS: "3"
          MRT_SITE_CONFIG: config/singapore.yaml
          # One bad station or diagram must not hold back the hourly
          # board deploy. With this opt-in the generator still writes
          # every page it can, the hubs omit whatever failed (so no
          # link dangles), and the step log lists what is missing; the
          # next hourly run fills the gap. Without it the generator
          # exits non-zero on any failed page.
          MRT_SITE_ALLOW_PARTIAL: "1"

      # Publish a real network layout only after it has been supplied and
      # reviewed. The miniature layout includes fictional fixture stations.
      - name: Generate the live map
        if: ${{ vars.MRT_MAP_LAYOUT != '' }}
        run: |
          if [ "$MRT_MAP_LAYOUT" = "config/layout-mini.geojson" ]; then
            echo "The fixture layout cannot be used for the production map." >&2
            exit 1
          fi
          test -f "$MRT_MAP_LAYOUT"
          cargo run --release -p mrt-map-static -- site/map feed.zip
        env:
          LTA_DATAMALL_ACCOUNT_KEY: ${{ secrets.LTA_DATAMALL_ACCOUNT_KEY }}
          MRT_MAP_LAYOUT: ${{ vars.MRT_MAP_LAYOUT }}
          MRT_MAP_SNAPSHOT_URL: ${{ vars.MRT_MAP_SNAPSHOT_URL }}

      # The editor is pinned in this repository: no private-repo token is needed.
      - name: Generate the fantasy map editor
        run: python3 scripts/build-fantasy-map.py site --singapore-gtfs feed.zip
        env:
          OFM_API_BASE: ${{ vars.OFM_API_BASE }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the Singapore MRT starter
        run: node scripts/check-singapore-starter.mjs site/fantasy-map/singapore-mrt.zip

      - name: Report the site size
        run: |
          du -sh site site/timetables
          if [ -d site/map ]; then du -sh site/map; fi
          find site -type f | wc -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
