[package]
name = "mrt-board-static"
description = "Generate a static dot-matrix board site for GitHub Pages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "mrt-board-static"

[[bin]]
name = "mrt-board-static"
path = "src/main.rs"

[[bin]]
name = "mrt-rt-snapshot"
path = "src/bin/rt_snapshot.rs"

[dependencies]
mrt-gtfs.workspace = true
mrt-gtfs-rt.workspace = true
mrt-datamall.workspace = true
serde.workspace = true
serde_json.workspace = true
