<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRTracker board</title>
<style>
  @font-face {
    font-family: "LTA Identity";
    src: url("assets/lta-identity.ttf") format("truetype");
  }
  :root {
    --bg: #0b0b0d;
    --fascia: #17181c;
    --amber: #e5d500;
    --green: #35d461;
    --red: #ff4b3a;
    --text: #e8e8e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "LTA Identity", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 12px;
  }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
  select {
    background: var(--fascia);
    color: var(--text);
    border: 1px solid #33343a;
    border-radius: 6px;
    font: inherit;
    padding: 6px 10px;
  }
  .fascia {
    background: var(--fascia);
    border-radius: 14px;
    padding: 18px 22px 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
    width: min(960px, 100%);
  }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .head h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .5px; }
  .chip {
    display: inline-block;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
  }
  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    color: #9a9aa2;
  }
  /* The freshness lamp of the live status feed. */
  .lamp {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #55565e;
    flex: none;
  }
  .lamp.ok { background: var(--green); box-shadow: 0 0 7px rgba(53,212,97,.7); }
  .lamp.stale { background: var(--amber); box-shadow: 0 0 7px rgba(229,213,0,.7); }
  .lamp.down { background: var(--red); box-shadow: 0 0 7px rgba(255,75,58,.7); }
  .lamp.beat { animation: beat .7s ease-out 1; }
  @keyframes beat { from { transform: scale(2); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .lamp.beat { animation: none; } }
  canvas { display: block; width: 100%; height: auto; background: #000; border-radius: 8px; }
  .legend { margin-top: 10px; font-size: 13px; color: #85858d; }
  .legend b.amber { color: var(--amber); }
  .legend b.green { color: var(--green); }
  .legend b.red { color: var(--red); }
</style>
</head>
<body>
  <div class="controls">
    <label for="station">Station</label>
    <select id="station"></select>
  </div>

  <div class="fascia">
    <div class="head">
      <h1 id="name">&nbsp;</h1>
      <span id="codes"></span>
      <span class="status" id="status">
        <span class="lamp" id="lamp"></span>
        <span id="statusText">starting up</span>
      </span>
    </div>
    <canvas id="panel"></canvas>
    <div class="legend">
      <b class="amber">destination</b> ·
      <b class="green">on time</b> ·
      <b class="red">delayed, cancelled, or alert</b> ·
      ~ headway-based time
    </div>
  </div>

<script>
"use strict";

/* 5x7 dot-matrix font. Each glyph is 7 rows of 5 bits, MSB left. */
const FONT = {
  "A":[0x0E,0x11,0x11,0x1F,0x11,0x11,0x11], "B":[0x1E,0x11,0x11,0x1E,0x11,0x11,0x1E],
  "C":[0x0E,0x11,0x10,0x10,0x10,0x11,0x0E], "D":[0x1E,0x11,0x11,0x11,0x11,0x11,0x1E],
  "E":[0x1F,0x10,0x10,0x1E,0x10,0x10,0x1F], "F":[0x1F,0x10,0x10,0x1E,0x10,0x10,0x10],
  "G":[0x0E,0x11,0x10,0x17,0x11,0x11,0x0F], "H":[0x11,0x11,0x11,0x1F,0x11,0x11,0x11],
  "I":[0x0E,0x04,0x04,0x04,0x04,0x04,0x0E], "J":[0x07,0x02,0x02,0x02,0x02,0x12,0x0C],
  "K":[0x11,0x12,0x14,0x18,0x14,0x12,0x11], "L":[0x10,0x10,0x10,0x10,0x10,0x10,0x1F],
  "M":[0x11,0x1B,0x15,0x15,0x11,0x11,0x11], "N":[0x11,0x19,0x15,0x13,0x11,0x11,0x11],
  "O":[0x0E,0x11,0x11,0x11,0x11,0x11,0x0E], "P":[0x1E,0x11,0x11,0x1E,0x10,0x10,0x10],
  "Q":[0x0E,0x11,0x11,0x11,0x15,0x12,0x0D], "R":[0x1E,0x11,0x11,0x1E,0x14,0x12,0x11],
  "S":[0x0F,0x10,0x10,0x0E,0x01,0x01,0x1E], "T":[0x1F,0x04,0x04,0x04,0x04,0x04,0x04],
  "U":[0x11,0x11,0x11,0x11,0x11,0x11,0x0E], "V":[0x11,0x11,0x11,0x11,0x0A,0x0A,0x04],
  "W":[0x11,0x11,0x11,0x15,0x15,0x1B,0x11], "X":[0x11,0x11,0x0A,0x04,0x0A,0x11,0x11],
  "Y":[0x11,0x11,0x0A,0x04,0x04,0x04,0x04], "Z":[0x1F,0x01,0x02,0x04,0x08,0x10,0x1F],
  "0":[0x0E,0x11,0x13,0x15,0x19,0x11,0x0E], "1":[0x04,0x0C,0x04,0x04,0x04,0x04,0x0E],
  "2":[0x0E,0x11,0x01,0x06,0x08,0x10,0x1F], "3":[0x1F,0x02,0x04,0x02,0x01,0x11,0x0E],
  "4":[0x02,0x06,0x0A,0x12,0x1F,0x02,0x02], "5":[0x1F,0x10,0x1E,0x01,0x01,0x11,0x0E],
  "6":[0x06,0x08,0x10,0x1E,0x11,0x11,0x0E], "7":[0x1F,0x01,0x02,0x04,0x08,0x08,0x08],
  "8":[0x0E,0x11,0x11,0x0E,0x11,0x11,0x0E], "9":[0x0E,0x11,0x11,0x0F,0x01,0x02,0x0C],
  " ":[0,0,0,0,0,0,0],
  ":":[0x00,0x04,0x04,0x00,0x04,0x04,0x00], ".":[0x00,0x00,0x00,0x00,0x00,0x0C,0x0C],
  "-":[0x00,0x00,0x00,0x0E,0x00,0x00,0x00], "/":[0x01,0x02,0x04,0x04,0x08,0x10,0x00],
  "&":[0x0C,0x12,0x14,0x08,0x15,0x12,0x0D], "'":[0x04,0x04,0x08,0x00,0x00,0x00,0x00],
  "(":[0x02,0x04,0x08,0x08,0x08,0x04,0x02], ")":[0x08,0x04,0x02,0x02,0x02,0x04,0x08],
  "+":[0x00,0x04,0x04,0x1F,0x04,0x04,0x00], "!":[0x04,0x04,0x04,0x04,0x04,0x00,0x04],
  ",":[0x00,0x00,0x00,0x00,0x0C,0x04,0x08], "~":[0x00,0x00,0x08,0x15,0x02,0x00,0x00],
};

/* Panel geometry, in dots. */
const CHAR_W = 6, CHAR_H = 8;
const COLS_CHARS = 36;
const MARGIN = 4;
const GRID_W = COLS_CHARS * CHAR_W + MARGIN * 2;
const ROW_PITCH = 10;
const N_ROWS = 4;
const TICKER_TOP = MARGIN + N_ROWS * ROW_PITCH + 2;
const GRID_H = TICKER_TOP + CHAR_H + MARGIN;
const PITCH = 10, RADIUS = 3.4;

const AMBER = "#e5d500", GREEN = "#35d461", RED = "#ff4b3a", OFF = "#151509";

const canvas = document.getElementById("panel");
canvas.width = GRID_W * PITCH;
canvas.height = GRID_H * PITCH;
const ctx = canvas.getContext("2d");

let board = null;      // data/board/<CODE>.json content
let live = null;       // data/live.json content
let tickerText = "";
let tickerOffset = 0;

/* Singapore keeps UTC+8 all year and has no daylight saving, so the
   board reads the same clock everywhere it is opened. */
const SGT_OFFSET_MS = 8 * 3600 * 1000;

/* Format a POSIX millisecond instant as a Singapore clock time. */
function sgtTime(ms, withSeconds) {
  const d = new Date(ms + SGT_OFFSET_MS);
  const parts = [d.getUTCHours(), d.getUTCMinutes()];
  if (withSeconds) parts.push(d.getUTCSeconds());
  return parts.map((n) => String(n).padStart(2, "0")).join(":");
}

function drawDot(x, y, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x * PITCH + PITCH / 2, y * PITCH + PITCH / 2, RADIUS, 0, Math.PI * 2);
  ctx.fill();
}

function drawText(text, colDot, rowDot, color) {
  for (let i = 0; i < text.length; i++) {
    const glyph = FONT[text[i].toUpperCase()] || FONT[" "];
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 5; c++) {
        if (glyph[r] & (1 << (4 - c))) {
          drawDot(colDot + i * CHAR_W + c, rowDot + r, color);
        }
      }
    }
  }
}

/* Look up the real-time state of one trip at this station. */
function tripState(tid) {
  const entry = live && live.trips ? live.trips[tid] : null;
  if (!entry) return { delay: 0, canceled: false, skipped: false };
  let delay = typeof entry.d === "number" ? entry.d : 0;
  let skipped = false;
  for (const stop of board.stops || []) {
    const v = (entry.s || {})[stop];
    if (v === "skip") skipped = true;
    else if (typeof v === "number") delay = v;
  }
  return { delay, canceled: !!entry.c, skipped };
}

/* Compute the next departures from the visitor's clock, with the
   real-time delays and cancellations applied. */
function currentRows() {
  if (!board) return [];
  const now = Date.now() / 1000;
  const rows = [];
  for (const [t, line, dest, exact, tid] of board.rows) {
    const state = tripState(tid);
    if (state.skipped) continue;
    const eta = t + (state.canceled ? 0 : state.delay);
    if (eta < now - 15) continue;
    rows.push({
      wait: eta - now,
      line, dest,
      exact: !!exact,
      delayed: state.delay >= 60,
      canceled: state.canceled,
    });
  }
  rows.sort((a, b) => a.wait - b.wait);
  return rows.slice(0, N_ROWS);
}

function waitText(row) {
  if (row.canceled) return "CANC";
  const mins = Math.round(row.wait / 60);
  let text = mins <= 0 ? "ARR" : mins + " MIN";
  if (!row.exact) text = "~" + text;
  return text;
}

function render() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) drawDot(x, y, OFF);
  }

  const rows = currentRows();
  rows.forEach((row, i) => {
    drawText(String(i + 1), MARGIN, MARGIN + i * ROW_PITCH, AMBER);
    drawText(row.dest.toUpperCase().slice(0, 24), MARGIN + 2 * CHAR_W, MARGIN + i * ROW_PITCH, AMBER);
    const wait = waitText(row);
    const color = row.canceled || row.delayed ? RED : GREEN;
    drawText(wait, MARGIN + (COLS_CHARS - wait.length) * CHAR_W, MARGIN + i * ROW_PITCH, color);
  });
  if (board && !rows.length) {
    drawText("NO TRAIN SERVICE", MARGIN + 8 * CHAR_W, MARGIN + ROW_PITCH, AMBER);
  }

  if (tickerText) {
    const totalDots = tickerText.length * CHAR_W;
    const col = GRID_W - (tickerOffset % (totalDots + GRID_W));
    ctx.save();
    ctx.beginPath();
    ctx.rect(MARGIN * PITCH, 0, (GRID_W - 2 * MARGIN) * PITCH, canvas.height);
    ctx.clip();
    drawText(tickerText, col, TICKER_TOP, RED);
    ctx.restore();
  } else {
    const text = sgtTime(Date.now(), true) + " SGT";
    drawText(text, MARGIN + (COLS_CHARS - text.length) * CHAR_W, TICKER_TOP, GREEN);
  }
}

let lastFrame = 0;
function tick(ts) {
  if (ts - lastFrame > 33) {
    tickerOffset += 1;
    render();
    lastFrame = ts;
  }
  requestAnimationFrame(tick);
}

/* Data plumbing. */

const DEFAULT_STATION = "NS1";

let currentStation = DEFAULT_STATION; // the first code of the station on screen
let stations = [];                    // data/stations.json content
let liveUrl = "data/live.json";
let liveFallback = null;
let liveCheckedAt = 0;                // visitor clock, last live fetch that worked
let liveFailedAt = 0;                 // visitor clock, last live fetch that failed
let liveSourceUrl = "";               // the source that answered last

async function fetchJson(path) {
  const res = await fetch(path, { cache: "no-cache" });
  if (!res.ok) throw new Error(path + " -> " + res.status);
  return res.json();
}

function chipColor(code) {
  const prefix = (code.match(/^[A-Z]+/) || ["?"])[0];
  const colors = {
    NS: "#d42e12", EW: "#009645", CG: "#009645", NE: "#9900aa",
    CC: "#fa9e0d", CE: "#fa9e0d", DT: "#005ec4", TE: "#9d5b25",
    BP: "#748477", SK: "#748477", SE: "#748477", SW: "#748477", STC: "#748477",
    PG: "#748477", PE: "#748477", PW: "#748477", PTC: "#748477",
  };
  return colors[prefix] || "#555";
}

/* Station aliases in the URL. Every code of a station names it, in
   any spelling: NS1, ns-1, NS 1, and EW24 all open Jurong East.
   Station names are no aliases, because the feed carries names that
   two stations share, for example Bukit Panjang. */

/* Reduce any spelling to a comparison key, the way the library does:
   lower case, letters and digits only. */
function normalizeAlias(text) {
  return String(text == null ? "" : text).toLowerCase().replace(/[^a-z0-9]/g, "");
}

/* Resolve an alias to the station code that names its board file. */
function resolveStation(alias) {
  const key = normalizeAlias(alias);
  if (!key) return null;
  for (const station of stations) {
    if (station.codes.some((code) => normalizeAlias(code) === key)) return station.codes[0];
  }
  return null;
}

/* The freshness of the live status feed. */

function agoText(secs) {
  if (secs < 10) return "just now";
  if (secs < 90) return Math.round(secs) + " s ago";
  const mins = Math.round(secs / 60);
  if (mins < 90) return mins + " min ago";
  return Math.round(mins / 60) + " h ago";
}

/* Flash the lamp when fresh live data lands. */
function flashLamp() {
  const lamp = document.getElementById("lamp");
  lamp.classList.remove("beat");
  void lamp.offsetWidth;  // restart the animation
  lamp.classList.add("beat");
}

/* The worst crowd level reported for this station. */
function crowdLevel() {
  if (!board || !live || !live.live) return "";
  const names = { l: "low", m: "moderate", h: "high" };
  const order = ["", "low", "moderate", "high"];
  let worst = "";
  for (const code of board.codes) {
    const level = names[(live.crowd || {})[code]];
    if (level && order.indexOf(level) > order.indexOf(worst)) worst = level;
  }
  return worst;
}

/* Repaint the status line: the data source, the crowd level, the
   Singapore time the snapshot was built, and how long ago the page
   last reached the live feed. A lamp carries the same state: green
   when the feed is current, amber when it is falling behind, red
   when the last attempt failed. */
function updateStatus() {
  const now = Date.now();
  const parts = [live && live.live ? "live status" : "schedule only"];

  const crowd = crowdLevel();
  if (crowd) parts.push("crowd: " + crowd);

  const generated = (live && live.generated) || (board && board.generated) || 0;
  if (generated) parts.push("data " + sgtTime(generated * 1000, false));

  let state = "";
  const tip = [];
  if (!liveCheckedAt && !liveFailedAt) {
    parts.push("checking the live feed");
  } else if (liveFailedAt > liveCheckedAt) {
    parts.push("live check failed " + agoText((now - liveFailedAt) / 1000));
    state = "down";
    tip.push("The last check at " + sgtTime(liveFailedAt, true) + " reached no source.");
  } else {
    parts.push("checked " + agoText((now - liveCheckedAt) / 1000));
    const checkAge = (now - liveCheckedAt) / 1000;
    const dataAge = generated ? now / 1000 - generated : Infinity;
    // Amber when the poll is falling behind, when the snapshot is
    // old, or when the deployment carries no live layer at all.
    state = !(live && live.live) || checkAge > 120 || dataAge > 900 ? "stale" : "ok";
  }
  if (liveCheckedAt) {
    tip.push("Live status fetched at " + sgtTime(liveCheckedAt, true) +
             (liveSourceUrl ? " from " + liveSourceUrl : "") + ".");
  }
  if (generated) {
    tip.push("The snapshot was built at " + sgtTime(generated * 1000, true) + ".");
  }
  tip.push("The page checks the live feed every 30 seconds.");

  const lamp = document.getElementById("lamp");
  lamp.classList.toggle("ok", state === "ok");
  lamp.classList.toggle("stale", state === "stale");
  lamp.classList.toggle("down", state === "down");
  document.getElementById("statusText").textContent = parts.join(" · ");
  document.getElementById("status").title = tip.join("\n");
}

function updateHeader() {
  if (board) {
    document.getElementById("name").textContent = board.name;
    const codes = document.getElementById("codes");
    codes.innerHTML = "";
    for (const code of board.codes) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = code;
      chip.style.background = chipColor(code);
      codes.appendChild(chip);
      codes.appendChild(document.createTextNode(" "));
    }

    let notice = "";
    if (live && live.live && live.disrupted) {
      const affected = (live.segments || []).some((segment) =>
        (segment.stations || []).some((s) => board.codes.includes(s)));
      if (affected) notice = (live.messages || []).join("   +++   ");
    }
    tickerText = notice.toUpperCase();
  }
  updateStatus();
}

async function loadStation() {
  try {
    board = await fetchJson("data/board/" + encodeURIComponent(currentStation) + ".json");
  } catch (e) {
    board = null;
    tickerText = "";
    document.getElementById("name").textContent = "Unknown station";
    document.getElementById("codes").innerHTML = "";
  }
  updateHeader();
}

async function loadLive() {
  // A changing query defeats any CDN cache in front of a snapshot.
  const bust = "t=" + Math.floor(Date.now() / 30000);
  const urls = [liveUrl];
  if (liveFallback) urls.push(liveFallback);
  if (!urls.includes("data/live.json")) urls.push("data/live.json");
  for (const url of urls) {
    try {
      live = await fetchJson(url + (url.includes("?") ? "&" : "?") + bust);
      liveCheckedAt = Date.now();
      liveFailedAt = 0;
      liveSourceUrl = url;
      flashLamp();
      updateHeader();
      return;
    } catch (e) { /* try the next source */ }
  }
  // Every source failed. Keep the snapshot that is on screen, and
  // let the lamp report how old it is.
  liveFailedAt = Date.now();
  updateHeader();
}

async function init() {
  try {
    const config = await fetchJson("data/config.json");
    if (config.live_url) liveUrl = config.live_url;
    if (config.fallback_url) liveFallback = config.fallback_url;
  } catch (e) { /* keep the fallback */ }

  stations = await fetchJson("data/stations.json");

  const requested = new URLSearchParams(location.search).get("station");
  currentStation =
    resolveStation(requested) ||
    resolveStation(DEFAULT_STATION) ||
    (stations[0] && stations[0].codes[0]) ||
    DEFAULT_STATION;

  const select = document.getElementById("station");
  for (const station of stations) {
    const option = document.createElement("option");
    option.value = station.codes[0];
    option.textContent = station.name + " (" + station.codes.join(", ") + ")";
    if (station.codes.includes(currentStation)) option.selected = true;
    select.appendChild(option);
  }
  select.addEventListener("change", () => {
    currentStation = select.value;
    history.replaceState(null, "", "?station=" + encodeURIComponent(currentStation));
    loadStation();
  });
  await loadLive();
  await loadStation();
  setInterval(loadStation, 10 * 60 * 1000);
  setInterval(loadLive, 30 * 1000);
  setInterval(updateStatus, 1000);
  requestAnimationFrame(tick);
}

init();
</script>
</body>
</html>
